name: Release the PSP compiler

# Pushing a tag such as mwccpsp-v1.0.0 builds the native mwccpsp for each
# platform and attaches mwccpsp-native64-<os>-<arch>.tar.gz to a release, the
# names the Castlevania: Symphony of the Night build downloads.
on:
  push:
    tags:
      - 'mwccpsp-*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in Docker
        run: |
          docker build -f tools/mwccpsp/Dockerfile -t mwccpsp .
          mkdir -p build
          docker run --rm -v "$PWD/build:/out" mwccpsp
          sudo chown "$(id -u):$(id -g)" build/mwccpsp

      - name: Smoke test
        run: |
          printf 'int f(int x) { return x + 1; }\n' > t.c
          build/mwccpsp -c -O4,p t.c -o t.o
          file t.o | grep -q 'ELF 32-bit LSB relocatable, MIPS'

      - name: Package
        run: |
          cp build/mwccpsp mwccpsp-native64-linux-amd64
          tar -czf mwccpsp-native64-linux-amd64.tar.gz mwccpsp-native64-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: mwccpsp-native64-linux-amd64
          path: mwccpsp-native64-linux-amd64.tar.gz

  macos:
    # an Apple Silicon runner builds both: the build only compiles with
    # clang -arch, it never runs the binary it makes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Get the original compiler
        run: |
          mkdir -p orig/PSP_3_0_1
          curl -fsSL -o mwccpsp_219.tar.gz \
            https://github.com/Xeeynamo/sotn-decomp/releases/download/cc1-psx-26/mwccpsp_219.tar.gz
          echo "62ec4faa807ad5afaefa7c92de6423505072c321fad13c071c2f640e9820b5c8  mwccpsp_219.tar.gz" | shasum -a 256 -c
          tar -xzf mwccpsp_219.tar.gz -C orig/PSP_3_0_1

      - name: Build
        run: |
          python3 tools/mwccpsp/native_build.py --arch arm64 -o build/mwccpsp-native64-darwin-arm64
          python3 tools/mwccpsp/native_build.py --arch x86_64 -o build/mwccpsp-native64-darwin-amd64
          file build/mwccpsp-native64-darwin-*

      - name: Smoke test
        run: |
          printf 'int f(int x) { return x + 1; }\n' > t.c
          build/mwccpsp-native64-darwin-arm64 -c -O4,p t.c -o t.o
          file t.o | grep -q 'ELF 32-bit LSB relocatable, MIPS'
          # the x86_64 build runs only where Rosetta is installed
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            build/mwccpsp-native64-darwin-amd64 -c -O4,p t.c -o t2.o
            cmp t.o t2.o
          fi

      - name: Package
        run: |
          cd build
          for a in arm64 amd64; do
            tar -czf mwccpsp-native64-darwin-$a.tar.gz mwccpsp-native64-darwin-$a
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mwccpsp-native64-darwin
          path: build/mwccpsp-native64-darwin-*.tar.gz

  release:
    # publish whatever built: if hosted macOS runners are short, re-running
    # the failed job later re-runs this one and adds its files
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.linux.result == 'success'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          overwrite_files: true
